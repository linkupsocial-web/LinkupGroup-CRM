services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Browser requests originate from the same public CMS domain.
      FRONTEND_URL: https://${CMS_DOMAIN}
      PUBLIC_API_URL: https://${CMS_DOMAIN}/api
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - web_proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${CMS_DOMAIN}/api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "4029"
    networks:
      - web_proxy

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      DISABLE_IPV6: "true"
      INITIAL_ADMIN_EMAIL: ${NPM_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD}
    ports:
      - "80:80"
      - "443:443"
      # Keep the proxy control panel private. Open it over an SSH tunnel:
      # ssh -L 8181:127.0.0.1:81 root@YOUR_VPS_IP
      - "127.0.0.1:81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - web_proxy

networks:
  # This named network is intentionally reusable. Future website Compose
  # projects can join `web_proxy` and be added as Proxy Hosts in NPM.
  web_proxy:
    name: web_proxy
    driver: bridge

volumes:
  npm_data:
  npm_letsencrypt:
